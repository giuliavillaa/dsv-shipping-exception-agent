<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-label="Triage flow: an exception is scored by severity. For medium and high cases the agent ranks two or three options and writes two drafts, a customer update and an internal note that asks for approval; a human decides before anything with a cost, an SLA commitment or customer contact runs. Low-severity cases are batched into a daily digest.">
  <style>
    .box  { fill:#F7F7F5; stroke:#DBD9D3; stroke-width:1.5 }
    .gate { fill:#E5E2F4; stroke:#3A2E8F; stroke-width:2.5 }
    .t    { font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:23px; font-weight:600; fill:#1A1C20 }
    .s    { font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:14px; fill:#5C6169 }
    .k    { font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:14px; fill:#8A8F97 }
    .ta   { fill:#3A2E8F }
    .line { stroke:#8A8F97; stroke-width:2; fill:none }
    .acc  { stroke:#3A2E8F; stroke-width:2.5; fill:none }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8F97"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3A2E8F"/>
    </marker>
  </defs>

  <rect width="940" height="400" fill="#EDECE7"/>
  <text class="k" x="30" y="46">triage flow</text>
  <text class="k" x="394" y="80">medium · high severity</text>

  <!-- main path -->
  <rect class="box" x="30" y="96" width="152" height="108" rx="2"/>
  <text class="t" x="48" y="136">Exception</text>
  <text class="s" x="48" y="162">air · ocean</text>
  <text class="s" x="48" y="182">road · rail</text>

  <line class="line" x1="182" y1="150" x2="204" y2="150" marker-end="url(#a)"/>

  <rect class="box" x="212" y="96" width="152" height="108" rx="2"/>
  <text class="t" x="230" y="136">Triage</text>
  <text class="s" x="230" y="162">SLA · tier</text>
  <text class="s" x="230" y="182">value · time</text>

  <line class="line" x1="364" y1="150" x2="386" y2="150" marker-end="url(#a)"/>

  <rect class="box" x="394" y="96" width="152" height="108" rx="2"/>
  <text class="t" x="412" y="136">Options</text>
  <text class="s" x="412" y="162">two or three</text>
  <text class="s" x="412" y="182">cost vs time</text>

  <line class="line" x1="546" y1="150" x2="568" y2="150" marker-end="url(#a)"/>

  <rect class="box" x="576" y="96" width="152" height="108" rx="2"/>
  <text class="t" x="594" y="136">Two drafts</text>
  <text class="s" x="594" y="162">customer update</text>
  <text class="s" x="594" y="182">internal note</text>

  <line class="acc" x1="728" y1="150" x2="750" y2="150" marker-end="url(#b)"/>

  <rect class="gate" x="758" y="96" width="152" height="108" rx="2"/>
  <text class="t ta" x="776" y="136">Approval</text>
  <text class="s" x="776" y="162">a human</text>
  <text class="s" x="776" y="182">decides</text>

  <!-- low-severity branch -->
  <path class="line" d="M288 204 L288 300 L386 300" marker-end="url(#a)"/>
  <text class="k" x="168" y="262">low severity</text>

  <rect class="box" x="394" y="256" width="152" height="88" rx="2"/>
  <text class="t" x="412" y="292">Digest</text>
  <text class="s" x="412" y="318">once a day</text>

  <!-- note -->
  <text class="s" x="576" y="292">nothing with a cost, an SLA</text>
  <text class="s" x="576" y="312">commitment or customer contact</text>
  <text class="s" x="576" y="332">runs before the approval</text>
</svg>
